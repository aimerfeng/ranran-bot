name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint（ruff）
        run: ruff check .

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      # 素材（595 张签图与字体）因版权原因不进仓库，未下载时相关用例自动跳过。
      # 想连素材一起验证就先跑：python scripts/fetch_fortune_assets.py
      - name: 覆盖率（仅供参考，不设门槛）
        run: |
          coverage run -m unittest discover -s tests
          coverage report -m
        continue-on-error: true
